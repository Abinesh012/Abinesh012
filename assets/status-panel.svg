<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" font-family="'Segoe UI','Courier New',monospace">
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a38"/><stop offset="100%" stop-color="#02061f"/>
    </linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#7b5cff"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="548" height="308" rx="8" fill="url(#p)"/>
  <rect x="6" y="6" width="548" height="308" rx="8" fill="none" stroke="url(#cy)" stroke-width="1.6"
        stroke-dasharray="1700" stroke-dashoffset="1700">
    <animate attributeName="stroke-dashoffset" values="1700;0" dur="1.4s" fill="freeze"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" begin="1.4s" repeatCount="indefinite"/>
  </rect>

  <!-- header -->
  <rect x="6" y="6" width="548" height="38" rx="8" fill="#00d4ff" opacity="0.10"/>
  <text x="24" y="31" fill="#00d4ff" font-size="15" font-weight="bold" letter-spacing="3">⟦ PLAYER STATUS WINDOW ⟧</text>
  <circle cx="528" cy="25" r="5" fill="#3bffb0"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>

  <!-- info rows -->
  <g font-size="13.5" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.8s" fill="freeze"/>
    <text x="24"  y="78"  fill="#5f7fb0">NAME</text>     <text x="150" y="78"  fill="#e6fbff">Sellappan Abinesh</text>
    <text x="24"  y="104" fill="#5f7fb0">CLASS</text>    <text x="150" y="104" fill="#8be9fd">Full-Stack Shadow Monarch</text>
    <text x="24"  y="130" fill="#5f7fb0">TITLE</text>    <text x="150" y="130" fill="#e6fbff">The One Who Ships</text>
    <text x="24"  y="156" fill="#5f7fb0">RANK</text>     <text x="150" y="156" fill="#00d4ff">A-RANK  ⬆ ascending to S</text>
    <text x="24"  y="182" fill="#5f7fb0">LOCATION</text> <text x="150" y="182" fill="#e6fbff">Tokyo Gate, Japan 🗼</text>
  </g>

  <!-- status active -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="1s" fill="freeze"/>
    <text x="24" y="208" fill="#5f7fb0" font-size="13.5">STATUS</text>
    <circle cx="154" cy="204" r="5" fill="#3bffb0"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="168" y="208" fill="#3bffb0" font-size="13.5">ACTIVE RAID — FirstQA Systems, Tokyo</text>
  </g>

  <!-- bars -->
  <g font-size="12">
    <text x="24" y="244" fill="#8be9fd">HP</text>
    <rect x="60" y="234" width="470" height="11" rx="5" fill="#10204a"/>
    <rect x="60" y="234" width="0" height="11" rx="5" fill="#00d4ff"><animate attributeName="width" values="0;446" dur="1.3s" begin="1.2s" fill="freeze"/></rect>

    <text x="24" y="270" fill="#8be9fd">MP</text>
    <rect x="60" y="260" width="470" height="11" rx="5" fill="#10204a"/>
    <rect x="60" y="260" width="0" height="11" rx="5" fill="#7b5cff"><animate attributeName="width" values="0;418" dur="1.3s" begin="1.4s" fill="freeze"/></rect>

    <text x="24" y="296" fill="#8be9fd">LV 28</text>
    <rect x="70" y="286" width="460" height="9" rx="4" fill="#10204a"/>
    <rect x="70" y="286" width="0" height="9" rx="4" fill="#3bffb0"><animate attributeName="width" values="0;300" dur="1.3s" begin="1.6s" fill="freeze"/></rect>
    <text x="445" y="295" fill="#5f7fb0" font-size="10">XP 7,400 to LV29</text>
  </g>
</svg>
