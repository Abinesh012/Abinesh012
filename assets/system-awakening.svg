<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020024"/>
      <stop offset="55%" stop-color="#06083a"/>
      <stop offset="100%" stop-color="#010b1e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3.2"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0a3a5c" stroke-width="0.6" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1000" height="340" fill="url(#bg)"/>
  <rect width="1000" height="340" fill="url(#grid)"/>
  <ellipse cx="500" cy="170" rx="520" ry="200" fill="url(#glow)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- floating runes/particles -->
  <g fill="#00d4ff">
    <circle cx="120" cy="80" r="2"><animate attributeName="cy" values="80;60;80" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="100" r="2.4"><animate attributeName="cy" values="100;78;100" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="270" r="1.8"><animate attributeName="cy" values="270;250;270" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="260" r="2"><animate attributeName="cy" values="260;240;260" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="5.5s" repeatCount="indefinite"/></circle>
    <rect x="60" y="160" width="3" height="3" transform="rotate(45 61 161)"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="940" y="180" width="3" height="3" transform="rotate(45 941 181)"><animate attributeName="opacity" values="0;1;0" dur="3.6s" repeatCount="indefinite"/></rect>
  </g>

  <!-- outer panel border (draws itself in) -->
  <rect x="30" y="30" width="940" height="280" rx="6" fill="none" stroke="url(#cyan)" stroke-width="2"
        stroke-dasharray="2440" stroke-dashoffset="2440">
    <animate attributeName="stroke-dashoffset" values="2440;0" dur="1.6s" fill="freeze"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" begin="1.6s" repeatCount="indefinite"/>
  </rect>

  <!-- corner brackets -->
  <g stroke="#00d4ff" stroke-width="3" fill="none" opacity="0">
    <path d="M40 60V40H60"/><path d="M940 40H960V60"/><path d="M960 280V300H940"/><path d="M60 300H40V280"/>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.6s" fill="freeze"/>
  </g>

  <!-- moving scanline -->
  <rect x="32" width="936" height="2" fill="#00d4ff" opacity="0.5">
    <animate attributeName="y" values="34;306;34" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- system label -->
  <text x="60" y="78" fill="#8be9fd" font-size="15" letter-spacing="6" opacity="0">
    [ S Y S T E M   N O T I F I C A T I O N ]
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.8s" fill="freeze"/>
  </text>

  <!-- main glow title -->
  <text x="500" y="178" text-anchor="middle" font-size="74" font-weight="bold" fill="#00d4ff"
        filter="url(#blur)" opacity="0">
    [ SYSTEM ]
    <animate attributeName="opacity" values="0;0.9;0.5;0.9" dur="2.4s" begin="2s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="178" text-anchor="middle" font-size="74" font-weight="bold" fill="#e6fbff" letter-spacing="4" opacity="0">
    [ SYSTEM ]
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="2s" fill="freeze"/>
  </text>

  <!-- subtitle: player line -->
  <text x="500" y="222" text-anchor="middle" font-size="18" fill="#00d4ff" letter-spacing="3" opacity="0">
    PLAYER &gt; ABINESH SELLAPPAN  //  CLASS: FULL-STACK SHADOW MONARCH
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="2.6s" fill="freeze"/>
  </text>

  <!-- ARISE pulse -->
  <text x="500" y="262" text-anchor="middle" font-size="22" font-weight="bold" fill="#7b5cff" letter-spacing="10" opacity="0">
    — A R I S E —
    <animate attributeName="opacity" values="0;1;0.35;1" dur="2s" begin="3.2s" repeatCount="indefinite"/>
  </text>

  <!-- bottom mini stat bars filling -->
  <g transform="translate(0 290)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3s" fill="freeze"/>
    <text x="300" y="4" fill="#8be9fd" font-size="11">HP</text>
    <rect x="324" y="-6" width="120" height="6" fill="#10204a" rx="3"/>
    <rect x="324" y="-6" width="0" height="6" fill="#00d4ff" rx="3"><animate attributeName="width" values="0;112" dur="1.2s" begin="3.2s" fill="freeze"/></rect>
    <text x="470" y="4" fill="#8be9fd" font-size="11">MP</text>
    <rect x="494" y="-6" width="120" height="6" fill="#10204a" rx="3"/>
    <rect x="494" y="-6" width="0" height="6" fill="#7b5cff" rx="3"><animate attributeName="width" values="0;104" dur="1.2s" begin="3.4s" fill="freeze"/></rect>
    <text x="640" y="4" fill="#3bffb0" font-size="11" opacity="0">ONLINE ●<animate attributeName="opacity" values="0;1;0.3;1" dur="1.5s" begin="4s" repeatCount="indefinite"/></text>
  </g>
</svg>
